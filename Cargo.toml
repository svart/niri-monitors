[package]
name = "niri-monitors"
version = "0.4.0"
edition = "2024"
description = "Monitor profile daemon and GUI for the niri compositor"
license = "MIT"
repository = "https://github.com/svart/niri-monitors"
homepage = "https://github.com/svart/niri-monitors"
readme = "README.md"
keywords = ["niri", "wayland", "monitors", "profiles", "daemon"]
categories = ["command-line-utilities", "config", "gui"]
exclude = ["AGENTS.md"]

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
eframe = { version = "0.31", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
toml_edit = { version = "0.22", default-features = false, features = ["display", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[[bin]]
name = "niri-monitors-gui"
path = "src/bin/niri-monitors-gui.rs"
required-features = ["gui"]

[profile.dev]
debug = "line-tables-only"
